services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: corn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-corn_dev_password}
      POSTGRES_DB: corn_leaf
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corn -d corn_leaf"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://corn:${POSTGRES_PASSWORD:-corn_dev_password}@db:5432/corn_leaf
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env (e.g. output of: openssl rand -hex 32)}
      CORS_ORIGINS: http://localhost:3000
      UPLOAD_DIR: /data/uploads
    volumes: [uploads:/data/uploads]
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on: [backend]
    ports: ["3000:3000"]

volumes:
  pgdata:
  uploads:
